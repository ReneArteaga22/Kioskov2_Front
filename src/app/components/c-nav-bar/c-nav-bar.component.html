<nav class="navbar">
  
  <div class="logo">
    <img [routerLink]="['/']" src="icons/CLAYENS_Mexico_Logo.png">

    <li *ngIf="isRH || isSistemas || isSeguridad" class="dropdown">
      <i *ngIf="isRH || isSistemas || isSeguridad" (click)="toggleMenu()" class="pi pi-user" style="font-size: 2rem; color: white;"></i>
      <div *ngIf="isMenuOpen" class="dropdown-content">
        <a *ngIf="isRH || isSistemas || isSeguridad" (click)="cerrarSesion()">Cerrar sesión</a>
      </div>
    </li>
    <div *ngIf="isRH || isSistemas || isSeguridad" class="user">
      
      <a style="color: white;" (click)="toggleMenu()">Hola {{usuario}}!</a>
    </div>
  </div>
  
  <!--Barra de navegacion-->
  <ul class="nav-links">
    <li *ngIf="isComedor"><a (click)="cerrarSesion()" style="color:rgb(31, 30, 30)">Cerrar sesion comedor</a></li>
    <li *ngIf="!isLoggin"><a [routerLink]="['/soporte-rh-modulos']">Soporte RH</a></li>
    <!-- <li *ngIf="!isLoggin"><a [routerLink]="['/']">Seguridad</a></li>
    <li *ngIf="!isLoggin"><a [routerLink]="['/']">Directorio</a></li> -->
    <li *ngIf="!isLoggin"><a [routerLink]="['/servicios']">Evaluacion de servicios</a></li>
    <!-- <li *ngIf="!isLoggin"><a [routerLink]="['/']">Encuestas</a></li> -->
    <li *ngIf="!isLoggin"><a [routerLink]="['/comunicado']">Comunicados</a></li>
    <p-dialog [modal]="true" [(visible)]="visible" [style]="{ width: '55rem', height: '87rem' }"
        [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }">
        <p-carousel [value]="images" [numVisible]="1" [numScroll]="1" [circular]="true" [autoplayInterval]="3000">
            <ng-template pTemplate="item" let-image>
                <div class="carousel-item" style="display:flex; justify-content:center; align-items:center; height: 100%;">
                    <img [src]="image.src" alt="{{image.alt}}" style="width: 100%; height: auto;">
                </div>
            </ng-template>
        </p-carousel>
    </p-dialog>
    <li *ngIf="!isLoggin"><a [routerLink]="['/buzon']">Buzon</a></li>

    <!-- <li *ngIf="!isLoggin"><a [routerLink]="['/']">Reconocimientos</a></li> -->
    <!-- <li *ngIf="isRH || isSistemas"><a [routerLink]="['/modulo_asistencia']">Modulo de asistencia</a></li> -->

    <!-- Moodulos de usuario RH, SISTEMAS, SEGURIDAD-->
    <li *ngIf="isRH || isSistemas || isSeguridad"><a [routerLink]="['/solicitudes']">Solicitudes</a></li>
    <li *ngIf="isRH || isSistemas || isSeguridad"><a [routerLink]="['/tablas-servicios']">Resultado de evaluaciones</a></li>
    <li *ngIf="isRH || isSistemas || isSeguridad"><a [routerLink]="['/usuarios']">Usuarios</a></li>
    <li *ngIf="isRH || isSistemas || isSeguridad"><a [routerLink]="['/comunicados']">Comunicados</a></li>
    <li *ngIf="isRH || isSistemas || isSeguridad"><a [routerLink]="['/sugerencias']">Buzon</a></li>
  
    <!-- <li *ngIf="isRH || isSistemas || isSeguridad"><a (click)="cerrarSesion()">Cerrar sesion</a></li> -->
    <i *ngIf="!isLoggin" [routerLink]="['/login']" class="pi pi-user" style="font-size: 2rem; color: white;"></i>
  </ul>
  <!--Barra de navegacion-->
  
  <!-- Menú select para pantallas pequeñas -->
  <select class="mobile-nav" (change)="navegar($event)">
    <option *ngIf="!isLoggin" value="" disabled selected>Navega por los módulos</option>
    <option *ngIf="!isLoggin" value="/soporte-rh" >Soporte RH</option>
    <option *ngIf="!isLoggin" value="/seguridad">Seguridad</option>
    <option *ngIf="!isLoggin" value="/directorio">Directorio</option>
    <option *ngIf="!isLoggin" value="/servicios">Evaluacion de servicios</option>
    <option *ngIf="!isLoggin" value="/encuestas">Encuestas</option>
    <option *ngIf="!isLoggin" value="/comunicados">Comunicados</option>
    <option *ngIf="!isLoggin" value="/reconocimientos">Reconocimientos</option>
    <option *ngIf="!isLoggin" value="/login">Login</option>

    <!-- Modultos para RH, SISTEMAS, SEGURIDAD-->
    <option *ngIf="isRH || isSistemas || isSeguridad" value="" disabled selected>Navega por los módulos</option>
    <option *ngIf="isRH || isSistemas || isSeguridad" value="/tablas-servicios">Resultado de evaluaciones</option>
    <option *ngIf="isRH || isSistemas || isSeguridad" value="/usuarios">Usuarios</option>

    <!-- Cerrar sesion option -->
    <option *ngIf="isLoggin" value="/login">Cerrar Sesion</option>
  </select>
</nav>
<div>
  <p-dialog [modal]="true" [(visible)]="closeSession" [style]="{ width: '400px', height: '200px', borderRadius: '8px'}">
      <div class="box-modal">
          <h2 class="">Cerrando sesion</h2>
          <img src="icons/cerrar_sesion.png" alt="">
      </div>
  </p-dialog>
</div>
