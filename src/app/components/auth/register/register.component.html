<div class="box">
    <div class="clayens"><img class="logo" [routerLink]="['/']" src="icons/CLAYENS_Mexico_Logo.png" alt=""></div>
    <div class="form">
        <form class="loginForm" [formGroup]="registerForm" >
            <h1>Iniciar sesion</h1>
            <div class="input">
                <label for="">Usuario o correo</label>
                <input type="text" placeholder="Ingresa tu correo o usuario" pInputText formControlName="correo" />    
            </div>
            <div class="input">
                <label for="">Contraseña</label>
                <input type="password" placeholder="Ingresa tu contraseña" pInputText formControlName="contrasena" />    
            </div>
            <div class="btn-box">
                <button class="btn" type="submit">Iniciar sesion</button>
            </div>
        </form>
    </div>
</div>
