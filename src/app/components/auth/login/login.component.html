<div class="box">
    <form class="loginForm" [formGroup]="loginForm" (ngSubmit)="login()">
        <div class="input">
            <label for="">Usuario</label>
            <input type="text" name="" id="" placeholder="Nombre de usuario" formControlName="correo">
        </div>
        <div class="input">
            <label for="">Contraseña</label>
            <input type="text" name="" id="" placeholder="Contraseña" formControlName="contrasena">
        </div>
        <div class="btn-box">
            <p-button class="btn" type="submit">Iniciar sesion</p-button>
        </div>
    </form>
</div>
