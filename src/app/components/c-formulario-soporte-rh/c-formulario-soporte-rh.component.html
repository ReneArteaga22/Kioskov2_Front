<div class="box">
    <form class="form" >
        <div class="box-inputs">
            <div class="input">
                <label>Folio</label>
                <input type="text">
            </div>
            <div class="input">
                <label>Fecha</label>
                <input type="datetime-local">
            </div>
        </div>
        <div class="box-inputs">
            <div class="input">
                <label>No. de empleado</label>
                <input type="text">
            </div>
            <select class="select">
                <option value="" disabled selected>Selecciona el grupo</option>
                <option value="">Grupo A</option>
                <option value="">Grupo B</option>
                <option value="">Grupo C</option>
                <option value="">Grupo D</option>
                <option value="">Calidad</option>
                <option value="">Administrativo</option>
            </select>
            <select class="select">
                <option value="" disabled selected>Selecciona la plata</option>
                <option value="">Planta 1</option>
                <option value="">Planta 2</option>
            </select>
        </div>
        <div class="box-inputs">
            <div class="input">
                <label>Nombre completo</label>
                <input type="text" placeholder="Escribe tu nombre completo">
            </div>
            <div class="input">
                <label>Telefono</label>
                <input type="text" placeholder="Escribe tu numero de telefono">
            </div>
        </div>
        <div class="box-inputs">
            <div class="input">
                <label>Reporte</label>
                <textarea placeholder="Escribe tu reporte..."></textarea>
            </div>
        </div>
        <div class="box-inputs">
            <div class="input">
                <button class="btn" type="submit">Enviar</button>
            </div>
        </div>
    </form>
</div>
