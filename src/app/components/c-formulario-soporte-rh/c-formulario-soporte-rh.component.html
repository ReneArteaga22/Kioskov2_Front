<div class="box">
    <form class="form" [formGroup]="soporterhForm" (ngSubmit)="enviar()">
        <div class="box-inputs">
            <div class="input">
                <label>Folio</label>
                <input type="text" placeholder="folio" formControlName="folio">
            </div>
            <div class="input">
                <label>Fecha</label>
                <input type="datetime-local">
            </div>
        </div>
        <div class="box-inputs">
            <div class="input">
                <label>No. de empleado</label>
                <input type="text" placeholder="Numero de empleado" formControlName="num_empleado">
            </div>
            <select class="select" formControlName="grupo">
                <option value="" disabled selected>Selecciona el grupo</option>
                <option value="grupo a">Grupo A</option>
                <option value="grupo b">Grupo B</option>
                <option value="grupo c">Grupo C</option>
                <option value="grupo d">Grupo D</option>
                <option value="calidad">Calidad</option>
                <option value="administrativo">Administrativo</option>
            </select>
            <select class="select" formControlName="planta">
                <option value="" disabled selected>Selecciona la plata</option>
                <option value="planta 1">Planta 1</option>
                <option value="planta 2">Planta 2</option>
            </select>
        </div>
        <div class="box-inputs">
            <div class="input">
                <label>Nombre completo</label>
                <input class="inp" type="text" placeholder="Escribe tu nombre completo" formControlName="nombre">
            </div>
            <div class="input">
                <label>Telefono</label>
                <input class="inp" type="text" placeholder="Escribe tu numero de telefono" formControlName="telefono">
            </div>
        </div>
        <div class="box-inputs">
            <div class="input">
                <label>Reporte</label>
                <textarea placeholder="Escribe tu reporte..." formControlName="reporte"></textarea>
            </div>
        </div>
        <div class="box-inputs">
            <div class="input">
                <button class="btn" type="submit">Enviar</button>
            </div>
        </div>
    </form>
</div>
