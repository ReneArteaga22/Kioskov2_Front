<div class="box">
    <nav class="navbar">
        <div class="logo">
            <img [routerLink]="['/']" src="icons/CLAYENS_Mexico_Logo.png">
        </div>
        <ul class="nav-links">
            <li><a [routerLink]="['/']">Soporte RH</a></li>
            <li><a [routerLink]="['/seguridad']">Seguridad</a></li>
            <li><a [routerLink]="['/']">Directorio</a></li>
            <li><a [routerLink]="['/servicios']">Evaluacion de servicios</a></li>
            <li><a [routerLink]="['/']">Encuestas</a></li>
            <li><a [routerLink]="['/']">Comunicados</a></li>
            <li><a [routerLink]="['/']">Reconocimientos</a></li>
            <i [routerLink]="['/login']" class="pi pi-user" style="font-size: 2rem; color: white;"></i>
        </ul>
    </nav>
    <div class="box-1">
        <div class="box-form">
            <h1>Formulario de calidad  para el Comedor</h1>
            <form action="" class="form" [formGroup]="comedorForm" (ngSubmit)="enviar()">
                <div class="input">
                    <label for="comentario">Deja un comentario</label>
                    <textarea id="comentario" placeholder="Escribe tu comentario (Opcional)" formControlName="calificacion"></textarea>
                </div>
                <div class="input-1">
                    <label for="">Calificacion</label>
                    <select class="btn-select" name="" id="">
                        <option value="" style="background-color: rgb(93, 197, 93); color: white;">Satisfactorio</option>
                        <option value="" style="background-color: rgb(238, 186, 89); color: white;">Aceptable</option>
                        <option value="" style="background-color: rgb(226, 114, 114); color: white;">Mejorable</option>
                    </select>
                </div>
                <div class="box-btn">
                    <button type="submit" class="btn">Enviar</button>
                </div>
            </form>
        </div>
    </div>
</div>
