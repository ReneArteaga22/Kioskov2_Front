<div class="cards">
    <!-- MODULO PARA USUARIOS DE COMEDOR -->
    <div *ngIf="isComedor" class="card" [routerLink]="['/comedor']">
        <h2>Comedor</h2>
        <img src="icons/comedor.png" alt="">
    </div>

    <!-- MODULOS PARA GUEST -->
    <div *ngIf="!isLoggin" class="card" [routerLink]="['/soporte-rh-modulos']" >
        <h2>Soporte RH</h2>
        <img src="icons/rh.png" alt="https://www.freepik.es/">
    </div>

    <div *ngIf="!isLoggin" class="card" [routerLink]="['/seguridad']">
        <h2>Seguridad</h2>
        <img src="icons/seguridad.png" alt="https://www.freepik.es/">
    </div>

    <div *ngIf="!isLoggin" class="card" [routerLink]="['/servicios']">
        <h2>Evaluacion de servicios</h2>
        <img src="icons/servicios.png" alt="https://www.freepik.es/">
    </div>

    <div *ngIf="!isLoggin" class="card" [routerLink]="['/comunicado']" >
        <h2>Comunicados</h2>
        <img src="icons/comunicados.png" alt="https://www.freepik.es/">
    </div>

    <div *ngIf="!isLoggin"  class="card" [routerLink]="['/buzon']">
        <h2>Buzon de sugerencias</h2>
        <img src="icons/buzon.png" alt="https://www.freepik.es/">
    </div>

    
    <div *ngIf="!isLoggin"  class="card" [routerLink]="['/directorio']">
        <h2>Directorio</h2>
        <img src="icons/directorio.png" alt="https://www.freepik.es/">
    </div>

    <!-- MODULOS PARA USUARIOS RECURSOS  -->
    <div *ngIf="isRH || isSistemas || isSeguridad" class="card" [routerLink]="['/solicitudes']" >
        <h2>Solicitudes</h2>
        <img src="icons/solicitud.png" alt="https://www.freepik.es/">
    </div>

    <div *ngIf="isSeguridad || isSistemas" class="card" [routerLink]="['/reportes-seguridad']">
        <h2>Seguridad</h2>
        <img src="icons/seguridad.png" alt="https://www.freepik.es/">
    </div>

    <div *ngIf="isRH || isSistemas || isSeguridad" class="card" [routerLink]="['/tablas-servicios']" >
        <h2>Resultados de evaluacion</h2>
        <img src="icons/resultados_evaluacion.png" alt="https://www.freepik.es/">
    </div>
    
    <div *ngIf="isRH || isSistemas || isSeguridad" class="card" [routerLink]="['/usuarios']" >
        <h2>Usuarios</h2>
        <img src="icons/usuarios.png" alt="https://www.freepik.es/">
    </div>

    <div *ngIf="isRH || isSistemas || isSeguridad" class="card" [routerLink]="['/comunicados']">
        <h2>Comunicados</h2>
        <img src="icons/comunicados.png" alt="https://www.freepik.es/">
    </div>

    <div *ngIf="isRH || isSistemas || isSeguridad" class="card" [routerLink]="['/sugerencias']" >
        <h2>Buzon de sugerencias</h2>
        <img src="icons/buzon.png" alt="https://www.freepik.es/">
    </div>
</div>
