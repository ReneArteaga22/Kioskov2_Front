<div class="cards">
    <div *ngIf="!isLoggin" class="card" [routerLink]="['/soporte-rh-modulos']" >
        <h2>Soporte RH</h2>
        <img src="icons/rh.png" alt="https://www.freepik.es/">
    </div>

    <div *ngIf="!isLoggin" class="card">
        <h2>Seguridad</h2>
        <img src="icons/seguridad.png" alt="https://www.freepik.es/">
    </div>

    <div *ngIf="!isLoggin" class="card">
        <h2>Directorio</h2>
        <img src="icons/directorio.png" alt="https://www.freepik.es/">
    </div>

    <div *ngIf="!isLoggin || isComedor1 || isComedor2" class="card" [routerLink]="['/servicios']">
        <h2>Evaluacion de servicios</h2>
        <img src="icons/servicios.png" alt="https://www.freepik.es/">
    </div>

    <div *ngIf="!isLoggin" class="card">
        <h2>Encuestas</h2>
        <img src="icons/encuestas.png" alt="https://www.freepik.es/">
    </div>

    <div *ngIf="!isLoggin" class="card">
        <h2>Comunicados</h2>
        <img src="icons/comunicados.png" alt="https://www.freepik.es/">
    </div>

    <div *ngIf="!isLoggin" [routerLink]="['/nominas']" class="card">
        <h2>Reconocimientos</h2>
        <img src="icons/trofeo.png" alt="https://www.freepik.es/">
    </div>

    <div *ngIf="isRH"  [routerLink]="['/solicitudes']" class="card">
        <h2>Solicitudes</h2>
        <img src="icons/solicitud.png" alt="https://www.freepik.es/">
    </div>

    <div *ngIf="isRH"  [routerLink]="['/tablas-servicios']" class="card">
        <h2>Resultados de evaluacion</h2>
        <img src="icons/resultados_evaluacion.png" alt="https://www.freepik.es/">
    </div>
    
    <div *ngIf="isRH"  [routerLink]="['/usuarios']" class="card">
        <h2>Usuarios</h2>
        <img src="icons/usuarios.png" alt="https://www.freepik.es/">
