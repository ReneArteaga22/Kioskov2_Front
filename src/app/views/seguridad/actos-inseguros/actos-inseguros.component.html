<app-c-nav-bar></app-c-nav-bar>
<div class="box">
    <div class="title">
        <h1>Reporte de actos inseguros</h1>
    </div>
    <div class="form-container">
        <form class="form" [formGroup]="actosForm" (ngSubmit)="ActiveModal()">
            <div class="input-box">
                <div class="input">
                    <label for="nombre">Nombre</label>
                    <input id="nombre" type="text" placeholder="Nombre (opcional)" formControlName="nombre">
                </div>
                <div class="input">
                    <label for="no-empleado">Numero de empleado</label>
                    <input id="no-empleado" type="number" placeholder="Num. de empleado (opcional)" formControlName="num_empleado">
                </div>
            </div>
            <div class="reporte">
                <label for="descripcion">Descripcion del reporte</label>
                <textarea id="descripcion" placeholder="Escribe con detalle el motivo de tu reporte, de ser necesario escribe nombres..." formControlName="descripcion"></textarea>
                <p *ngIf="error" class="error">No puedes deja el reporte vacio.</p>
            </div>
            <div class="reporte">
                <button class="btn">Enviar</button>
            </div>
        </form>
    </div>
</div>
<div>
    <p-dialog [modal]="true" [(visible)]="visible" [style]="{ width: '400px', height: '300px', borderRadius: '8px'}">
        <div class="box-modal">
            <h2 class="modal-title">La seguridad de tus datos es nuestra prioridad. No los utilizaremos sin tu consentimiento previo.</h2>
            <img src="icons/lock.png" alt="">
        </div>
    </p-dialog>
</div>
<div>
    <p-dialog [modal]="true" [(visible)]="visibleReporte" [style]="{ width: '400px', height: '200px', borderRadius: '8px'}">
        <div class="box-modal">
            <h2 class="">Reporte enviado!!</h2>
            <img src="icons/report.png" alt="">
        </div>
    </p-dialog>
</div>
<app-c-flechas></app-c-flechas>
