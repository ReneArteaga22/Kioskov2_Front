<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">

</head>
<body>
    <app-c-nav-bar></app-c-nav-bar>
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="form">
                    <h2 class="titulo">Avance por equipo 📈</h2>
                    <form [formGroup]="FormAvance" (ngSubmit)="RegistrarAvance()">
                        <div class="mb-3">
                            <input type="hidden" formControlName="equipoId">
                            <label for="avance" class="form-label">Avance:</label>
                            <input type="number" formControlName="porcentajeAvance" class="form-control" placeholder="Ingresa el avance 1-100" required>
                        </div>
                        <div class="text-center mt-4">
                            <button type="submit" class="btn btn-orange btn-lg">Registrar</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
</body>
</html>
