<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div>
    <nav class="navbar">
        <div class="logo">
            <img [routerLink]="['/']" src="icons/CLAYENS_Torreon.png">
        </div>
        
        <div class="campaign-message">
            Status del primer inventario 2025
        </div>
        
     <div class="user-actions">
        <p-card [header]="'Promedio de Avance'" 
                [styleClass]="'progress-card ' + getProgressClass(getPromedioAvance())">
        <h2 class="percentage-value" [ngClass]="getProgressClass(getPromedioAvance())">
            {{ getPromedioAvance() }}%
        </h2>
    </p-card>
</div>
    </nav>
</div>
    <div class="dashboard-wrapper">

  
        <div class="cards-container" *ngIf="!loading; else loadingTemplate">
          <div class="team-card" *ngFor="let avance of avances">
            <div class="card-content">
              <h3 class="team-name">{{ avance.user.nombre + ' '+ '('+avance.user.apellidos+')'}}</h3>
            
              <p-progressBar
                [value]="avance.porcentajeAvance"
                [showValue]="true"
                styleClass="custom-progress-bar"
                [ngClass]="getProgressBarClass(avance.porcentajeAvance)">
              </p-progressBar>
          
              <div class="percentage">{{ avance.porcentajeAvance }}%</div>
              <div class="timestamp">Actualizado: {{ avance.hora }}</div>
            </div>
          </div>
        </div>

  <ng-template #loadingTemplate>
    <div class="spinner-container">
      <p-progressSpinner></p-progressSpinner>
    </div>
  </ng-template>
</div>
</body>
</html>
