<app-c-bar></app-c-bar>
<div class="box">
    <form [formGroup]="sugerenciaForm" (ngSubmit)="mandar_sugerencia()" class="form">
        <h1>Dejanos tus sugerencias</h1>
        <div class="inputs">
            <div class="input">
                <label for="">Sugerencia</label>
                <textarea type="text" placeholder="Escribe tus sugerencias..." formControlName="sugerencia"></textarea>
                <p class="error" *ngIf="error">No puedes dejar espacios vacios.</p>
            </div>
            <div class="input">
                <button class="btn" type="submit">Mandar sugerencia</button>
            </div>
        </div>
    </form>
    <div>
        <p-dialog [modal]="true" [(visible)]="visible" [style]="{ width: '400px', height: '200px', borderRadius: '8px'}">
            <div class="box-modal">
                <h2 class="">Gracias por tu sugerencia!</h2>
                <img src="icons/success.png" alt="">
            </div>
        </p-dialog>
    </div>
</div>
