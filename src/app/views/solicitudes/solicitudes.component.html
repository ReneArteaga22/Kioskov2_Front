<div class="box">
    <div class="clayens"><img class="logo" [routerLink]="['/']" src="icons/CLAYENS_Mexico_Logo.png" alt=""></div>
    <div class="container">
        <form class="filters">
            <div>
                <select>
                    <option value="" disabled selected>Categoria</option>
                    <option value="Nominas">Nominas</option>
                    <option value="Retiro Ahorro">Retiro de ahorro</option>
                    <option value="Gafete">Gafete</option>
                    <option value="Consulta Vacaciones">Consultar vacaciones</option>
                </select>
            </div>
            <div>
                <select>
                    <option value="" disabled selected>Planta</option>
                    <option value="1">Planta 1</option>
                    <option value="2">Planta 2</option>
                </select>
            </div>
            <div>
                <select>
                    <option value="" disabled selected>Estado</option>
                    <option value="abierto">Abierto</option>
                    <option value="pendiente">Pendiente</option>
                    <option value="resuelto">Resuelto</option>
                </select>
            </div>
            <div>
                <button class="btn">Buscar</button>
            </div>
        </form>
        <div class="table">
            <h1>Reportes y Solicitudes</h1>
            <table class="reportes">
                <thead>
                    <tr>
                        <th>Folio</th>
                        <th>Categoria</th>
                        <th>Quien solicita</th>
                        <th>Estado</th>
                        <th>Planta</th>
                        <th>Fecha</th>
                    </tr>
                </thead>
                <tbody>
                    <tr (click)="abrir_reporte(reporte.id)" *ngFor="let reporte of reportes">
                        <td>{{reporte.folio}}</td>
                        <td>{{reporte.categoria}}</td>
                        <td>{{reporte.nombre}}</td>
                        <td>{{reporte.estatus}}</td>
                        <td>{{reporte.planta}}</td>
                        <td>{{reporte.fecha | date: 'yyyy/MM/dd'}}</td>
                    </tr>
                </tbody>
            </table>
        </div>        
    </div>
</div>
