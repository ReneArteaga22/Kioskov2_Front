<app-c-nav-bar></app-c-nav-bar>
<div class="box">
    <div class="filtros">
        <div class="box-grafico">
            <h1>Grafico de barras</h1>
        </div>
        <form class="box-tabla">
            <input class="input" type="text" placeholder="Buscar">
            <select formControlName="area" class="select-btn">
                <option value="" disabled selected>Selecciona la planta
                <option value="planta 1">Planta 1</option>
                <option value="planta 2">Planta 2</option>
            </select>
            <button class="btn">Buscar</button>
        </form>
    </div>
    <div class="graphics-table">
        <div class="graphics">    
            <p-chart type="bar" [data]="basicData" [options]="basicOptions"/>
            <p-chart type="bar" [data]="basicData" [options]="basicOptions"/>
            <p-chart type="bar" [data]="basicData" [options]="basicOptions"/>

            <p>Grafica de calificaciones del servicio de comedor </p>
        </div>
        <div class="table">
            <table class="evaluaciones">
                <thead>
                    <tr>
                        <th class="id">Calificacion</th>
                        <th>Planta</th>
                        <th>Servicio</th>
                        <th>Fecha</th>
                        <th class="area">Comentario</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let evaluacion of evaluaciones">
                        <td>{{evaluacion.calificacion}}</td>
                        <td>{{evaluacion.planta}}</td>
                        <td>{{evaluacion.servicio}}</td>
                        <td>{{evaluacion.createdAt | date: 'yyyy/MM/dd'}}</td>
                        <td><button class="comentario">Comentario</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
