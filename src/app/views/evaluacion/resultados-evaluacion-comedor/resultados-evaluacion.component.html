<app-c-nav-bar></app-c-nav-bar>
<div class="box">
    <div class="filtros">
        <div class="box-grafico">
            <h1>Grafico de barras</h1>
        </div>
        <div class="box-tabla">
            <input class="input" type="text" placeholder="Buscar">
            <button class="btn">Buscar</button>
        </div>
    </div>
    <div class="graphics-table">
        <div class="graphics">    
            <p-chart type="bar" [data]="evaluaciones" [options]="evaluaciones"/>
        </div>
        <div class="table">
            <table class="evaluaciones">
                <thead>
                    <tr>
                        <th class="id">Calificacion</th>
                        <th>Planta</th>
                        <th>Servicio</th>
                        <th>Fecha</th>
                        <th class="area">Comentario</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let evaluacion of evaluaciones">
                        <td>{{evaluacion.calificacion}}</td>
                        <td>{{evaluacion.planta}}</td>
                        <td>{{evaluacion.servicio}}</td>
                        <td>{{evaluacion.createdAt | date: 'yyyy/MM/dd'}}</td>
                        <td><button>Comentario</button></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
