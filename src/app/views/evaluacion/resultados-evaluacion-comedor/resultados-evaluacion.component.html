<app-c-nav-bar></app-c-nav-bar>
<div class="box">
    <div class="filtros">
        <div class="box-grafico">
            <h1>Grafico de barras</h1>
        </div>
        <form class="box-tabla" [formGroup]="filtrarForm" (ngSubmit)="filtrar()">
            <input class="input" type="text" placeholder="Buscar" formControlName="calificacion">
            <select formControlName="planta" class="select-btn">
                <option value="" disabled selected>Selecciona la planta</option>
                <option value="planta 1">Planta 1</option>
                <option value="planta 2">Planta 2</option>
                <option value="planta">Ambas plantas</option>
            </select>
            <button class="btn" type="submit">Buscar</button>
        </form>
    </div>
    <div class="graphics-table">
        <div class="graphics">    
            <p-chart type="bar" [data]="basicData" [options]="basicOptions"/>
            <p-chart type="bar" [data]="basicData" [options]="basicOptions"/>
            <p>Grafica de calificaciones del servicio comedor</p>
        </div>
        <div class="table">
            <table class="evaluaciones">
                <thead>
                    <tr>
                        <th class="id">Calificacion</th>
                        <th>Planta</th>
                        <th>Servicio</th>
                        <th>Fecha</th>
                        <th class="area">Comentario</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let evaluacion of evaluaciones">
                        <td>{{evaluacion.calificacion}}</td>
                        <td>{{evaluacion.planta}}</td>
                        <td>{{evaluacion.servicio}}</td>
                        <td>{{evaluacion.createdAt | date: 'yyyy/MM/dd'}}</td>
                        <td><p-button (click)="mostrarComentario(evaluacion.id);" class="Comentario" label="Comentario"/></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div class="card flex justify-content-center" style="padding: 20px;">
        <p-dialog header="Comentario" [modal]="true" [(visible)]="visible"
            [style]="{ width: '300px', height: '300px', backgroundColor: '#f9f9f9', padding: '20px', borderRadius: '8px'}">
            <ng-template pTemplate="header">
                <div style="text-align: center; text-decoration: underline;">
                    <h1>Comentario</h1>
                </div>
            </ng-template>
            <h3>{{ comentario }}</h3>
        </p-dialog>
    </div>
</div>
