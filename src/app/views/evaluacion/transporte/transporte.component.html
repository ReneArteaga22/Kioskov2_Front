<app-c-nav-bar></app-c-nav-bar>
<div>
    <form class="form" [formGroup]="transporteForm" (ngSubmit)="enviar()">
        <h1>Formulario de calidad  para el Transporte</h1>
        <div class="input">
            <label>Deja un comentario</label>
            <textarea placeholder="Escribe tu comentario (Opcional)"></textarea>
        </div>
        <h1>Que te parecio el servicio? </h1>
        <div class="box-img">
            <div class="caritas">
                <h1>Muy bueno</h1>
                <img src="icons/love.png" alt="">
            </div>
            <div class="caritas">
                <h1>Bueno</h1>
                <img src="icons/happy.png" alt="">
            </div>
            <div class="caritas">
                <h1>Malo</h1>
                <img src="icons/triste.png" alt="">
            </div>
            <div class="caritas">
                <h1>Muy malo</h1>
                <img src="icons/sad.png" alt="">
            </div>       
        </div>
        <div class="box-btn">
            <select class="select-btn" placeholder="seelcciona">
                <option value="planta 1">Planta 1</option>
                <option value="planta 2">Planta 2</option>
            </select>
            <button type="submit" class="btn">Enviar</button>
        </div>
    </form>
</div>
