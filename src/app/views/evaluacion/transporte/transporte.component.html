<app-c-nav-bar></app-c-nav-bar>
<div>
    <h1 class="title">Formulario de calidad  para el Transporte</h1>
    <form class="form" [formGroup]="transporteForm" (ngSubmit)="enviar()">
        <div class="input">
            <label>Deja un comentario</label>
            <textarea formControlName="comentario" placeholder="Escribe tu comentario (Opcional)"></textarea>
        </div>
        <h1>Que te parecio el servicio? </h1>
        <div class="box-img">
            <div class="caritas" (click)="calificacion('Muy bueno','transporte')" [class.selected]="selectedOption === 'Muy bueno'">
                <h1>Muy bueno</h1>
                <div class="carita">
                    <img src="icons/love.png" alt="">
                </div>
            </div>
            <div class="caritas" (click)="calificacion('Bueno','transporte')" [class.selected]="selectedOption === 'Bueno'">
                <h1>Bueno</h1>
                <div class="carita">
                    <img src="icons/happy.png" alt="">
                </div>
            </div>
            <div class="caritas" (click)="calificacion('Malo','transporte')" [class.selected]="selectedOption === 'Malo'">
                <h1>Malo</h1>
                <div class="carita">
                    <img src="icons/triste.png" alt="">
                </div>
            </div>
            <div class="caritas" (click)="calificacion('Muy malo','transporte')" [class.selected]="selectedOption === 'Muy malo'">
                <h1>Muy malo</h1>
                <div class="carita">
                    <img src="icons/sad.png" alt="">
                </div>
            </div>       
        </div>
        <p *ngIf="error" class="error">Porfavor selecciona una calificacion.</p>
        <div class="box-btn">
            <button type="submit" class="btn">Enviar</button>
        </div>
    </form>
    <div>
        <p-dialog [modal]="true" [(visible)]="visible" [style]="{ width: '400px', height: '200px', borderRadius: '8px'}">
            <div class="box-modal">
                <h2 class="">Gracias por evaluar!!</h2>
                <img src="icons/mail.png" alt="">
            </div>
        </p-dialog>
    </div>
</div>
<app-c-flechas></app-c-flechas>
