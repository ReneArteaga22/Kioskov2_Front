<app-c-nav-bar></app-c-nav-bar>
<div class="box">
    <div class="container">
        <div>
            <h1>Graficas generales</h1>
            <p-chart type="bar" [data]="basicData" [options]="basicOptions"/>
            <p-chart type="bar" [data]="basicData" [options]="basicOptions"/>
        </div>
        <div class="table">
            <div>
                <h1>Filtros</h1>
                <form class="form" [formGroup]="filtrarForm" (ngSubmit)="filtrar()">
                    <div>
                        <input class="input" type="text" placeholder="Buscar por calificacion" formControlName="calificacion">
                    </div>
                    <div>
                        <button class="btn" type="submit" [disabled]="!filtrarForm.valid">Buscar</button>
                    </div>
                </form>
            </div>
            <div class="tabla">
                <table>
                    <thead>
                        <tr>
                            <th class="id">Calificacion</th>
                            <th>Planta</th>
                            <th>Servicio</th>
                            <th>Fecha</th>
                            <th class="area">Comentario</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let evaluacion of paginacionEvaluaciones">
                            <td>{{evaluacion.calificacion}}</td>
                            <td>{{evaluacion.planta}}</td>
                            <td>{{evaluacion.servicio}}</td>
                            <td>{{evaluacion.createdAt | date: 'yyyy/MM/dd'}}</td>
                            <td><p-button (click)="mostrarComentario(evaluacion.id);" class="Comentario" label="Comentario"/></td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="card flex justify-content-center">
                <p-paginator 
                (onPageChange)="onPageChange($event)" 
                [first]="first" 
                [rows]="rows"
                [totalRecords]="totalRecords" 
                [rowsPerPageOptions]="[15, 20]">
                </p-paginator>
            </div>
        </div>
    </div>
    <div class="card flex justify-content-center" style="padding: 20px;">
        <p-dialog header="Comentario" [modal]="true" [(visible)]="visible"
            [style]="{ width: '300px', height: '300px', backgroundColor: '#f9f9f9', padding: '20px', borderRadius: '8px'}">
            <ng-template pTemplate="header">
                <div style="text-align: center; text-decoration: underline;">
                    <h1>Comentario</h1>
                </div>
            </ng-template>
            <h3>{{ comentario }}</h3>
        </p-dialog>
    </div>
</div>
