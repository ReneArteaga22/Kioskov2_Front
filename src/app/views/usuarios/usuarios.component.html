<app-c-nav-bar></app-c-nav-bar>
<div class="box">
    <div class="container">
        <form class="filtros" [formGroup]="buscarUsuarioForm" (ngSubmit)="buscar_usuario()">
            <div>
                <input type="text" placeholder="Buscar usuario..." formControlName="nombre">
            </div>
            <div>
                <select class="select-btn" formControlName="area">
                    <option value="" disabled selected>Area</option>
                    <option value="gerencia">Gerencia</option>
                    <option value="sistemas">Sistemas</option>
                    <option value="rh">Recursos Humanos</option>
                    <option value="almacen">Almacen</option>
                    <option value="">Todos</option>
                </select>
            </div>
            <div>
                <button class="btn" type="submit">Buscar</button>
            </div>
        </form>
        <div class="table">
            <div class="title">
                <div><h1 class="titulo">Lista de usuarios</h1></div>
                <div><button class="btn-register">Registrar Usuario</button></div>
            </div>
            <table class="reportes">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Area</th>
                    </tr>
                </thead>
                <tbody>
                    <tr (click)="usuarios_info(usuario.id)" *ngFor="let usuario of paginatedUsuarios">
                        <td class="uppercase">{{usuario.nombre}}</td>
                        <td class="uppercase">{{usuario.apellidos}}</td>
                        <td class="uppercase">{{usuario.area === 'rh' ? 'Recursos Humanos' : usuario.area }}</td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card flex justify-content-center">
            <p-paginator 
            (onPageChange)="onPageChange($event)" 
            [first]="first" 
            [rows]="rows"
            [totalRecords]="totalRecords" 
            [rowsPerPageOptions]="[15, 20]">
            </p-paginator>
        </div>
    </div>
</div>
