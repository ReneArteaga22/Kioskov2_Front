<div class="box">
    <div class="clayens"><img class="logo" [routerLink]="['/']" src="icons/CLAYENS_Mexico_Logo.png" alt=""></div>
    <div class="container">
        <form class="filtros" [formGroup]="buscarUsuarioForm" (ngSubmit)="buscar_usuario()">
            <div>
                <input type="text" placeholder="Buscar usuario..." formControlName="nombre">
            </div>
            <div>
                <select class="select-btn" formControlName="area">
                    <option value="" disabled selected>Area</option>
                    <option value="gerencia">Gerencia</option>
                    <option value="sistemas">Sistemas</option>
                    <option value="rh">Recursos Humanos</option>
                    <option value="almacen">Almacen</option>
                </select>
            </div>
            <div>
                <button class="btn" type="submit">Buscar</button>
            </div>
        </form>
        <div class="table">
            <h1>Lista de Usuarios</h1>
            <table class="reportes">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Area</th>
                    </tr>
                </thead>
                <tbody>
                    <tr (click)="usuarios_info(usuario.id)" *ngFor="let usuario of usuarios">
                        <td>{{usuario.id}}</td>
                        <td>{{usuario.nombre}}</td>
                        <td>{{usuario.apellidos}}</td>
                        <td>{{usuario.area}}</td>
                    </tr>
                </tbody>
            </table>
        </div> 
    </div>
</div>
