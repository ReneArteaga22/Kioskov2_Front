<div class="box">
    <div class="clayens"><img class="logo" [routerLink]="['/']" src="icons/CLAYENS_Mexico_Logo.png" alt=""></div>
    <div class="box-table">
        <div class="box-filtros">
            <form [formGroup]="buscarUsuarioForm" (ngSubmit)="buscar_usuario()">
                <input class="input" type="text" placeholder="Esribe el nombre" formControlName="nombre">
                <select class="select-btn">
                    <option value="rh">Recursos Humano</option>
                    <option value="sistemas">Sistemas</option>
                </select>
                <button class="btn" type="submit">Buscar</button>
                <button class="btn-register" [routerLink]="['/register']">Registrar Usuario</button>
            </form>
        </div>
        <div class="box-table-users">
            <table>
                <thead>
                    <tr>
                        <th class="id">ID</th>
                        <th>Nombre</th>
                        <th>Apellidos</th>
                        <th>Usuario</th>
                        <th class="area">Área</th>
                    </tr>
                </thead>
                <tbody>
                    <tr (click)="alert()" *ngFor="let usuario of usuarios">
                        <td>{{ usuario.id }}</td>
                        <td>{{ usuario.nombre }}</td>
                        <td>{{ usuario.apellidos }}</td>
                        <td>{{ usuario.usuario }}</td>
                        <td>{{ usuario.area }}</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
