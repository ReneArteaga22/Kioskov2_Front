<div>
    <app-c-nav-bar></app-c-nav-bar>
    <p-dialog [modal]="true" [(visible)]="visible" [style]="dialogStyle">
        <p-carousel [value]="images" [numVisible]="1" [numScroll]="1" [circular]="true" [autoplayInterval]="3000">
            <ng-template class="box-carousel" pTemplate="item" let-image>
                <div class="carousel-item">
                    <img [src]="'http://10.99.22.17:3333' + image.imagen" alt="{{image.alt}}">
                </div>
            </ng-template>
        </p-carousel>
    </p-dialog>    
</div>
