<div class="box">
    <app-c-bar></app-c-bar>
    <div class="comunicados">
        <div class="comunicado">
            <h1>Comunicados</h1>
            <table>  
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Imagen</th>
                        <th>Fecha</th>
                        <th>Eliminar</th>
                        <th>Agregar</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let comunicado of paginacionComunicados">
                        <td>{{comunicado.id}}</td>
                        <td><img src="{{comunicado.imagen}}" alt=""></td>
                        <td>{{comunicado.fecha | date : "yyyy/MM/dd"}}</td>
                        <td><button class="delete" (click)="dialog(comunicado.id)"><i class="pi pi-trash" style="font-size: 2rem"></i></button></td>
                        <td><button class="post" (click)="agregar()"><i class="pi pi-plus-circle" style="font-size: 2rem"></i></button></td>
                    </tr>
                </tbody>
            </table>
            <div class="card flex justify-content-center">
                <p-paginator (onPageChange)="onPageChange($event)" [first]="first" [rows]="rows" [totalRecords]="totalRecords">
                </p-paginator>
            </div>
        </div>
        <div class="menu">
            <h1>Menu semanal</h1>
            <table>
                <thead>
                    <tr>
                        <th>Imagen</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><img src="comunicados/hamster.jpg" alt=""></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div>
        <p-dialog [modal]="true" [(visible)]="visible" [style]="{ width: '400px', height: '400px', borderRadius: '8px'}">
            <div class="box-modal">
                <img src="icons/warning.png" alt="">
                <h2 class="">¿Seguro que quieres eliminar este comunicado?</h2>
                <div class="buttons">
                    <button class="delete" (click)="eliminar()">Eliminar</button>
                    <button class="done" (click)="cancelar()" style="background-color: orange;">Cancelar</button>
                </div>
            </div>
        </p-dialog>
    </div>
    <div>
        <p-dialog [modal]="true" [(visible)]="visibleForm" [style]="{ width: '600px', height: '400px', borderRadius: '8px'}">
            <div class="box-modal">
                <h2 class="">Agregar comunicado</h2>
                <form class="form" [formGroup]="comunicadoForm" (ngSubmit)="agregar_comunicado()">
                    <div class="input">
                        <p-fileUpload name="demo[]" url="https://www.primefaces.org/cdn/api/upload.php"
                            [multiple]="true" accept="image/*" maxFileSize="1000000" formContorlName="imagen">
                            <ng-template pTemplate="content">
                                <ul *ngIf="uploadedFiles.length">
                                    <li *ngFor="let file of uploadedFiles">
                                        {{ file.name }} - {{ file.size }} bytes
                                    </li>
                                </ul>
                            </ng-template>
                        </p-fileUpload>
                    </div>
                    <div class="input">
                        <label for="">Nombre</label>
                        <input type="text" formControlName="nombre" placeholder="Ingresa el nombre">
                    </div>
                    <div class="input">
                        <label for="">Fecha</label>
                        <input type="date" formControlName="fecha">
                    </div>
                    <div class="btn">
                        <button type="submit" (click)="alert()" [disabled]="!comunicadoForm.valid">Agregar</button>
                    </div>
                </form>
            </div>
        </p-dialog>
    </div>
    <div>
        <p-dialog [modal]="true" [(visible)]="modal" [style]="{ width: '400px', height: '250px', borderRadius: '8px'}">
            <div class="box-modal">
                <h2 class="">Comunicado agregado correctamente</h2>
                <img src="icons/success.png" alt="">
            </div>
        </p-dialog>
    </div>
</div>
