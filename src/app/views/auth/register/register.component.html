<div class="box">
    <app-c-bar></app-c-bar>
    <div class="box-form">
        <form class="form" [formGroup]="registerForm" (ngSubmit)="register()">
            <div class="box-input">
                <h1>Registrar usuario</h1>
                <div class="input">
                    <div>
                        <label for="">Nombre</label>
                        <input type="text" placeholder="Ingresa el nombre" formControlName="nombre">
                    </div>
                    <div>
                        <label for="">Apellido</label>
                        <input type="text" placeholder="Ingresa el apellido" formControlName="apellidos">
                    </div>
                </div>
                <div class="input">
                    <div>
                        <label for="">Usuario</label>
                        <input type="text" placeholder="Ingresa el nombre de usuario" formControlName="usuario">
                    </div>
                    <div>
                        <label for="">Contraseña</label>
                        <input type="password" placeholder="Ingresa la contraseña" formControlName="contrasena">
                    </div>
                </div>
                <div class="input">
                    <div>
                        <label for="">Area</label>
                        <select class="select-btn" formControlName="area">
                            <option value="Area" selected disabled>Selecciona el area</option>
                            <option value="rh">Recursos Humanos</option>
                            <option value="sistemas">Sistemas</option>
                        </select>
                    </div>
                </div>
                <div class="input">
                    <div>
                        <label for="">Puesto</label>
                        <input type="text" placeholder="Ingresa la puesto" formControlName="puesto">
                    </div>
                    <!-- <div>
                        <label for="">Firma</label>
                        <input type="text" placeholder="Ingresa la firma" formControlName="firma">
                    </div> -->
                </div>
                <div class="input">
                    <div>
                        <label for="">Correo</label>
                        <input type="email" placeholder="Ingresa el correo" formControlName="correo">
                    </div>
                    <div>
                        <label for="">Telefono</label>
                        <input type="number" placeholder="Ingresa el telefono" formControlName="telefono">
                    </div>
                </div>
                <div class="input">
                    <!-- <div>
                        <label for="">Foto</label>
                        <input type="text" placeholder="Ingresa la fotografia" formControlName="foto">
                    </div> -->
                </div>
                <div *ngIf="error" class="box-input">
                    <p class="error">No puedes dejar espacios vacios!!</p>
                </div>
                <div class="box-btn">
                    <button class="btn" type="submit">Registrar</button>
                </div>
            </div>
        </form>
    </div>
    <div>
        <p-dialog [modal]="true" [(visible)]="visible" [style]="{ width: '400px', height: '200px', borderRadius: '8px'}">
            <div class="box-modal">
                <h2 class="">Usuario registrado!!</h2>
                <img src="icons/success.png" alt="">
            </div>
        </p-dialog>
    </div>
</div>
