<app-c-bar></app-c-bar>
<div class="box">
    <div class="box-form">
        <form class="form" [formGroup]="loginForm" (ngSubmit)="login()">
            <div class="inputs">
                <div class="box-title">
                    <h1 class="title">Iniciar sesion</h1>
                </div>
                <div class="box-input">
                    <label for="">Usuario o correo</label>
                    <input class="input" type="text" placeholder="Ingresa tu usuario/correo" formControlName="uids">
                </div>
                <div class="box-input">
                    <label for="">Contraseña</label>
                    <input class="input" type="password" placeholder="Ingresa tu contraseña" formControlName="contrasena">
                </div>
                <div class="box-btn">
                    <button class="btn" type="submit" [disabled]="!loginForm.valid">Iniciar sesion</button>
                </div>
                <div *ngIf="error" class="box-input">
                    <p class="error">Usuario o contraseña incorrectos</p>
                </div>
                <div class="box-input">
                </div>
            </div>
        </form>
    </div>
    <div>
        <p-dialog [modal]="true" [(visible)]="visible" [style]="{ width: '400px', height: '200px', borderRadius: '8px'}">
            <div class="box-modal">
                <h2 class="">Inicio de sesion exitoso!!</h2>
                <img src="icons/success.png" alt="">
            </div>
        </p-dialog>
    </div>
</div>
