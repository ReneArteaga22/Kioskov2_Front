<div class="box">
    <app-c-bar></app-c-bar>
    <div class="box-form">
        <form class="form" (ngSubmit)="recuperar()">
            <div class="inputs">
                <div class="box-title">
                    <h1 class="title">Recuperar contraseña</h1>
                </div>
                <div class="box-input">
                    <label for="">Correo</label>
                    <input class="input" type="text" placeholder="Ingresa tu correo" formControlName="correo">
                </div>
                <div class="box-input">
                    <label for="">Contraseña</label>
                    <input class="input" type="password" placeholder="Ingresa tu contraseña" formControlName="contrasena">
                </div>
                <div class="box-btn">
                    <button class="btn" type="submit">Recuperar</button>
                </div>
            </div>
        </form>
    </div>
</div>
