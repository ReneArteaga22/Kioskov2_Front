<app-c-nav-bar></app-c-nav-bar>
<div class="box">
    <div class="table">
        <h1>Lista de sugerencias generales.</h1>
        <table>
            <thead>
                <tr>
                    <th>Sugerencia</th>
                    <th>Fecha</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let sugerencia of paginatedSugerencias">
                    <td>{{sugerencia.sugerencia}}</td>
                    <td>{{sugerencia.createdAt | date: 'yyyy/MM/dd'}}</td>
                </tr>
            </tbody>
        </table>
        <div class="card flex justify-content-center">
            <p-paginator 
            (onPageChange)="onPageChange($event)" 
            [first]="first" 
            [rows]="rows"
            [totalRecords]="totalRecords" >
            </p-paginator>
        </div>
    </div>
</div>
<app-c-flechas></app-c-flechas>
